name: Build OpenWRT for Xiaomi R3P

on:
  workflow_dispatch:  # 手动触发编译（新手友好）

env:
  # 小米R3P专属配置（关键！不能错）
  TARGET_SYSTEM: ramips
  TARGET_SUBTARGET: mt7621
  TARGET_PROFILE: xiaomi_mir3p
  FEEDS_CONF: feeds.conf.default

jobs:
  build:
    runs-on: ubuntu-22.04  # 稳定的编译环境
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        run: |
          make defconfig  # 加载默认配置
          make menuconfig -o .config  # 应用R3P配置

      - name: Build firmware
        run: |
          make -j$(nproc) || make -j1 V=s  # 多核编译，失败则单核调试

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-xiaomi-r3p-firmware
          path: bin/targets/${{ env.TARGET_SYSTEM }}/${{ env.TARGET_SUBTARGET }}/*.bin
